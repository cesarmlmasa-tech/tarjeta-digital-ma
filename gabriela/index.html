<style>
:root{--blue:#0759a5;--navy:#073664;--text:#17324d;--muted:#6d7b89;--bg:#eef3f7}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:520px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 28px #0001}
.brand{padding:22px 28px 18px;text-align:center;background:#fff}
.brand img{display:block;max-width:360px;width:100%;height:auto;margin:0 auto}
.hero{height:220px;background:url('../sergio/quienes somos.png') center/cover no-repeat}
.card{padding:26px 24px 32px;text-align:center}

.role{font-size:19px;margin:6px 0 2px;font-weight:700}
.company{color:var(--muted);font-weight:700;margin-bottom:24px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.action{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--navy);font-weight:700;font-size:14px}
.ico{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:25px}
.save{display:block;text-decoration:none;background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;font-weight:800;padding:17px;border-radius:30px;margin:18px 0;font-size:17px}
.secondary{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.secondary a,.secondary span{padding:15px 10px;border-radius:12px;background:#f1f4f6;text-decoration:none;color:var(--navy);font-weight:700}
.secondary span{opacity:.7}
.footer{padding:18px 24px;background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;text-align:center;font-size:13px;letter-spacing:1px}
